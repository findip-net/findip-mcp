name: Publish to the MCP Registry

# Lists server.json in the official MCP Registry. Run by hand after the npm
# version named in server.json is live. GitHub OIDC proves the run comes from a
# findip-net repository, which is what grants the io.github.findip-net/ name;
# no token or personal account is involved.
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check server.json matches package.json
        run: |
          test "$(node -p "require('./server.json').name")" = "$(node -p "require('./package.json').mcpName")"
          test "$(node -p "require('./server.json').packages[0].version")" = "$(node -p "require('./package.json').version")"

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Log in with GitHub OIDC
        run: ./mcp-publisher login github-oidc

      - name: Publish
        run: ./mcp-publisher publish
